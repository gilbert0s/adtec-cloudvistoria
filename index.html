<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADTEC CloudVistoria - Portal Unificado AWS</title>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1200.0.min.js"></script>
    <script src="config.js"></script>
    <style>
        body {
            background-color: #0a192f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333333;
        }

        .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 550px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }

        h2 {
            color: #0052cc;
            margin-bottom: 25px;
            font-size: 22px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #0052cc;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #b3d4ff;
            border-radius: 6px;
            font-size: 16px;
            color: #0033aa;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #0052cc;
        }

        .btn-entrar {
            background-color: #0052cc;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .btn-entrar:hover {
            background-color: #0033aa;
        }

        .btn-sair {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #e63946;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            transition: background-color 0.2s;
        }

        .btn-sair:hover {
            background-color: #c1121f;
        }

        .area-inquilino {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .nome-arquivo {
            color: #0033aa;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 20px;
            display: block;
        }

        .btn-download-inquilino {
            background-color: #4dabf7;
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(77, 171, 247, 0.4);
            transition: background-color 0.3s;
        }

        .btn-download-inquilino:hover {
            background-color: #339af0;
        }

        .area-admin {
            display: none;
            text-align: left;
            animation: fadeIn 0.5s ease-in-out;
        }

        .area-admin h3 {
            color: #0052cc;
            border-bottom: 2px solid #b3d4ff;
            padding-bottom: 10px;
            margin-top: 0;
        }

        .btn-adm-acao {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-size: 15px;
        }

        .btn-adm-acao:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .admin-logs {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            padding: 12px;
            border-radius: 6px;
            height: 220px;
            overflow-y: auto;
            margin-top: 15px;
            white-space: pre-wrap;
        }

        .erro-msg {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <button id="btn-sair-global" class="btn-sair" onclick="deslogarSistema()">Sair ✕</button>

        <div id="secao-login">
            <h2>Insira os dados para acessar o sistema</h2>
            <div class="input-group">
                <label for="login">Login ou Código:</label>
                <input type="text" id="login" placeholder="Ex: admin ou ADTEC-K8J32">
            </div>
            
            <div class="input-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" placeholder="******">
            </div>
            
            <button class="btn-entrar" onclick="processarLogin()">Entrar no Sistema</button>
            <p id="erro" class="erro-msg"></p>
        </div>

        <div id="secao-inquilino" class="area-inquilino">
            <h2>Pasta de Vistoria Liberada</h2>
            <span class="nome-arquivo" id="txt-endereco-imovel">📁 Carregando dados da AWS...</span>
            <button class="btn-download-inquilino" onclick="executarDownloadS3()">Download de Todas as Mídias</button>
        </div>

        <div class="area-admin" id="secao-admin">
            <h3>Painel de Controle ADTEC (Nuvem AWS S3)</h3>
            
            <div class="input-group">
                <label for="upload-pasta">1. Selecionar Pasta Mãe de Vistorias:</label>
                <input type="file" id="upload-pasta" webkitdirectory directory multiple onchange="analisarPastaLocal()">
            </div>

            <div class="admin-logs" id="box-logs">Aguardando seleção de pasta para iniciar varredura...</div>

            <button class="btn-adm-acao" id="btn-processar-aws" onclick="executarSincronismoAWS()" disabled>2. Sincronizar Tudo na AWS</button>
        </div>
    </div>

    <script>
        const AWS_ACCESS_KEY_ID = AWS_CONFIG.accessKeyId;
        const AWS_SECRET_ACCESS_KEY = AWS_CONFIG.secretAccessKey;
        const AWS_BUCKET_NAME = AWS_CONFIG.bucketName;
        const AWS_REGION = AWS_CONFIG.region;

        const ADMIN_USER = "admin";
        const ADMIN_PASS = "adtec123";
        const JSON_INDEX_KEY = "index_vistorias.json";

        AWS.config.update({
            accessKeyId: AWS_ACCESS_KEY_ID,
            secretAccessKey: AWS_SECRET_ACCESS_KEY,
            region: AWS_REGION
        });

        const s3 = new AWS.S3();
        let mapaPastasImoveis = {}; 

        function adicionarLog(mensagem) {
            const box = document.getElementById('box-logs');
            const agora = new Date().toLocaleTimeString();
            box.innerText += `\n[${agora}] ${mensagem}`;
            box.scrollTop = box.scrollHeight;
        }

        async function baixarBancoIndex() {
            try {
                const dados = await s3.getObject({ Bucket: AWS_BUCKET_NAME, Key: JSON_INDEX_KEY }).promise();
                return JSON.parse(dados.Body.toString('utf-8'));
            } catch (err) {
                if (err.code === 'NoSuchKey') {
                    return {};
                }
                adicionarLog(`⚠️ Erro ao ler banco index: ${err.message}`);
                return {};
            }
        }

        function processarLogin() {
            const login = document.getElementById('login').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const erro = document.getElementById('erro');
            
            const secaoLogin = document.getElementById('secao-login');
            const secaoInquilino = document.getElementById('secao-inquilino');
            const secaoAdmin = document.getElementById('secao-admin');
            const btnSair = document.getElementById('btn-sair-global');

            erro.style.display = 'none';

            if (login === ADMIN_USER && senha === ADMIN_PASS) {
                secaoLogin.style.display = 'none';
                secaoAdmin.style.display = 'block';
                btnSair.style.display = 'block';
                return;
            }

            if (login.startsWith("ADTEC-") && senha.length === 6) {
                erro.innerText = "Verificando chaves de acesso na AWS...";
                erro.style.display = 'block';
                
                const txtKey = `vistorias/${login}/Acesso Online.txt`;
                s3.getObject({ Bucket: AWS_BUCKET_NAME, Key: txtKey }, function(err, data) {
                    if (err) {
                        erro.innerText = "Código de acesso não encontrado ou expirado na nuvem.";
                        erro.style.display = 'block';
                    } else {
                        const textoConfig = data.Body.toString('utf-8');
                        
                        if (textoConfig.includes(`Senha: ${senha}`)) {
                            erro.style.display = 'none';
                            secaoLogin.style.display = 'none';
                            secaoInquilino.style.display = 'block';
                            btnSair.style.display = 'block';
                            
                            const matchEndereco = textoConfig.match(/Endereço: (.+)/);
                            const matchAno = textoConfig.match(/Ano de Referência da Vistoria: (.+)/);
                            
                            const enderecoTela = matchEndereco ? matchEndereco[1] : "Imóvel ADTEC";
                            const anoTela = matchAno ? matchAno[1] : "";
                            
                            document.getElementById('txt-endereco-imovel').innerText = `📁 ${enderecoTela} (${anoTela})`;
                            window.sessaoLoginInquilino = login;
                        } else {
                            erro.innerText = "Senha incorreta para este código de vistoria.";
                            erro.style.display = 'block';
                        }
                    }
                });
                return;
            }

            erro.innerText = "Credenciais incorretas. Verifique as chaves de acesso.";
            erro.style.display = 'block';
        }

        function deslogarSistema() {
            document.getElementById('login').value = "";
            document.getElementById('senha').value = "";
            document.getElementById('secao-login').style.display = 'block';
            document.getElementById('secao-inquilino').style.display = 'none';
            document.getElementById('secao-admin').style.display = 'none';
            document.getElementById('btn-sair-global').style.display = 'none';
            document.getElementById('upload-pasta').value = "";
            document.getElementById('box-logs').innerText = "Aguardando seleção de pasta para iniciar varredura...";
            document.getElementById('btn-processar-aws').disabled = true;
            mapaPastasImoveis = {};
        }

        // AGORA 100% SEM FILTROS DE EXTENSÃO: TUDO ENTRA NO EMBARQUE
        function analisarPastaLocal() {
            const inputPasta = document.getElementById('upload-pasta');
            const arquivos = inputPasta.files;
            const boxLogs = document.getElementById('box-logs');
            boxLogs.innerText = ""; 

            if (arquivos.length === 0) return;

            adicionarLog(`Varredura iniciada. Mapeando árvore de diretórios...`);
            mapaPastasImoveis = {};

            const PREFIXOS_VALIDOS = ["rua", "r.", "avenida", "av.", "praça", "pç", "alameda", "al."];
            const ELEMENTOS_VALIDOS = ["centro", "bairro", "loja", "fundos", "parque", "vilela", "jardim"];

            for (let i = 0; i < arquivos.length; i++) {
                const arquivo = arquivos[i];
                const caminoRelativo = arquivo.webkitRelativePath || arquivo.relativePath;

                let anoDetectado = "2026"; 
                const matchAno = caminoRelativo.match(/202[0-9]/);
                if (matchAno) {
                    anoDetectado = matchAno[0];
                }

                const partes = caminoRelativo.split('/');
                if (partes.length > 2) {
                    const nomePastaImovel = partes[partes.length - 2];
                    const nomePastaMinusculo = nomePastaImovel.toLowerCase();

                    const temPrefixo = PREFIXOS_VALIDOS.some(p => nomePastaMinusculo.includes(p));
                    const temElemento = ELEMENTOS_VALIDOS.some(e => nomePastaMinusculo.includes(e));

                    if (temPrefixo || temElemento) {
                        if (!mapaPastasImoveis[nomePastaImovel]) {
                            mapaPastasImoveis[nomePastaImovel] = {
                                ano: anoDetectado,
                                fotos: [] // Mantido o nome técnico da variável por compatibilidade
                            };
                        }
                        
                        // REMOVIDO FILTRO DE IMAGEM: Qualquer arquivo que esteja na pasta vai entrar para o upload
                        mapaPastasImoveis[nomePastaImovel].fotos.push(arquivo);
                    }
                }
            }

            const totalImoveis = Object.keys(mapaPastasImoveis).length;
            if (totalImoveis > 0) {
                adicionarLog(`Filtro de Endereço OK! Encontrados ${totalImoveis} diretórios na fila:`);
                for (let imovel in mapaPastasImoveis) {
                    adicionarLog(` -> 📁 [Ano: ${mapaPastasImoveis[imovel].ano}] ${imovel} (${mapaPastasImoveis[imovel].fotos.length} arquivos detectados)`);
                }
                document.getElementById('btn-processar-aws').disabled = false;
            } else {
                adicionarLog(`⚠️ Nenhuma subpasta no padrão de endereços foi identificada.`);
            }
        }

        async function limparFotosAntigasNoS3(loginToken) {
            const prefixoPasta = `vistorias/${loginToken}/fotos/`;
            try {
                const objetos = await s3.listObjectsV2({ Bucket: AWS_BUCKET_NAME, Prefix: prefixoPasta }).promise();
                if (!objetos.Contents || objetos.Contents.length === 0) {
                    return;
                }

                const listaExclusao = objetos.Contents.map(objeto => ({ Key: objeto.Key }));
                await s3.deleteObjects({
                    Bucket: AWS_BUCKET_NAME,
                    Delete: { Objects: listaExclusao }
                }).promise();
                
                adicionarLog(`   -> [CLEANUP] Diretório antigo limpo na AWS.`);
            } catch (err) {
                adicionarLog(`   ⚠️ Alerta de integridade durante a limpeza: ${err.message}`);
            }
        }

        // MOTOR DE BACKUP TOTAL E INCREMENTAL
        async function executarSincronismoAWS() {
            document.getElementById('btn-processar-aws').disabled = true;
            adicionarLog("🚀 Baixando arquivo index de controle da AWS...");
            
            let bancoIndex;
            try {
                bancoIndex = await baixarBancoIndex();
            } catch (bancoErr) {
                adicionarLog(` ❌ Erro ao inicializar index: ${bancoErr.message}`);
                document.getElementById('btn-processar-aws').disabled = false;
                return;
            }
            
            let houveModificacaoNoBanco = false;

            for (let nomeImovel in mapaPastasImoveis) {
                const dadosImovel = mapaPastasImoveis[nomeImovel];
                const anoVistoria = dadosImovel.ano;
                const chaveUnicaBanco = `${nomeImovel} (${anoVistoria})`;

                let loginToken = "";
                let senderPass = ""; 
                let precisaLimparS3 = false;

                if (bancoIndex[chaveUnicaBanco]) {
                    loginToken = bancoIndex[chaveUnicaBanco].login;
                    senderPass = bancoIndex[chaveUnicaBanco].senha;
                    precisaLimparS3 = true; 
                    adicionarLog(`\n🔄 Sincronismo Incremental detectado para: ${chaveUnicaBanco}`);
                } else {
                    const sufixo = Math.random().toString(36).substring(2, 7).toUpperCase();
                    loginToken = `ADTEC-${sufixo}`;
                    senderPass = Math.floor(100000 + Math.random() * 900000).toString();

                    adicionarLog(`\n🆕 Novo Registro Identificado: ${chaveUnicaBanco}`);
                    
                    bancoIndex[chaveUnicaBanco] = {
                        login: loginToken,
                        senha: senderPass,
                        enderecoOriginal: nomeImovel,
                        ano: anoVistoria
                    };
                    houveModificacaoNoBanco = true;
                }

                const conteudoTXT = 
                    `ADTEC IMÓVEIS - DADOS DE ACESSO À VISTORIA\n` +
                    `=========================================\n` +
                    `Endereço: ${nomeImovel}\n` +
                    `Ano de Referência da Vistoria: ${anoVistoria}\n` +
                    `Login: ${loginToken}\n` +
                    `Senha: ${senderPass}\n` +
                    `=========================================\n` +
                    `Copie os dados acima para enviar ao inquilino por WhatsApp.`;

                const txtKey = `vistorias/${loginToken}/Acesso Online.txt`;
                
                try {
                    await s3.putObject({
                        Bucket: AWS_BUCKET_NAME,
                        Key: txtKey,
                        Body: conteudoTXT,
                        ContentType: "text/plain; charset=utf-8"
                    }).promise();
                } catch (err) {
                    adicionarLog(` ❌ Falha crítica de comunicação com S3: ${err.message}`);
                    continue;
                }

                if (precisaLimparS3) {
                    adicionarLog(` -> Faxina preventiva iniciada na pasta da AWS...`);
                    await limparFotosAntigasNoS3(loginToken);
                }

                adicionarLog(` -> Enviando lote completo de arquivos (${dadosImovel.fotos.length} itens)...`);
                
                for (const arquivo of dadosImovel.fotos) {
                    const arquivoKey = `vistorias/${loginToken}/fotos/${arquivo.name}`;
                    
                    // MECANISMO ANTI-TRAVAMENTO DE EXTENSÃO: Se vier sem tipo, força um formato binário aceitável
                    const tipoDetectado = arquivo.type || "application/octet-stream";
                    
                    try {
                        adicionarLog(`   -> Upload: ${arquivo.name} ...`);
                        await s3.putObject({
                            Bucket: AWS_BUCKET_NAME,
                            Key: arquivoKey,
                            Body: arquivo,
                            ContentType: tipoDetectado
                        }).promise();
                        adicionarLog(`   -> [SUCESSO] ${arquivo.name} enviado.`);
                    } catch (err) {
                        adicionarLog(`   ❌ Falha ao enviar ${arquivo.name}: ${err.message}`);
                    }
                }
                adicionarLog(` -> [OK] Sincronização finalizada com integridade de espelho.`);
                adicionarLog(`\n📋 ENVIAR NO WHATSAPP:\n${conteudoTXT}\n------------------------`);
            }

            if (houveModificacaoNoBanco) {
                adicionarLog("\n💾 Atualizando banco de dados index_vistorias.json na AWS...");
                try {
                    await s3.putObject({
                        Bucket: AWS_BUCKET_NAME,
                        Key: JSON_INDEX_KEY,
                        Body: JSON.stringify(bancoIndex, null, 2),
                        ContentType: "application/json"
                    }).promise();
                    adicionarLog(" -> [BANCO ATUALIZADO] Segurança de integridade garantida.");
                } catch (err) {
                    adicionarLog(` ❌ Erro ao salvar arquivo JSON mestre: ${err.message}`);
                }
            }

            alert("Sincronismo inteligente finalizado! Todos os arquivos da pasta foram espelhados com sucesso.");
            document.getElementById('btn-processar-aws').disabled = false;
        }

        function ejecutarDownloadS3() {
            const login = window.sessaoLoginInquilino;
            if (!login) return;

            adicionarLog("Conectando à AWS e montando links de download...");
            const prefixoPasta = `vistorias/${login}/fotos/`;

            s3.listObjectsV2({ Bucket: AWS_BUCKET_NAME, Prefix: prefixoPasta }, function(err, data) {
                if (err) {
                    alert("Erro ao ler arquivos no servidor: " + err.message);
                } else {
                    if (data.Contents.length === 0) {
                        alert("Nenhum arquivo ativo localizado para esta vistoria.");
                        return;
                    }
                    
                    alert(`Preparando download de ${data.Contents.length} arquivos de vistoria...`);
                    
                    data.Contents.forEach(objeto => {
                        const urlConstruida = s3.getSignedUrl('getObject', {
                            Bucket: AWS_BUCKET_NAME,
                            Key: objeto.Key,
                            Expires: 60 
                        });
                        
                        const linkTemporario = document.createElement('a');
                        linkTemporario.href = urlConstruida;
                        linkTemporario.download = objeto.Key.split('/').pop();
                        document.body.appendChild(linkTemporario);
                        linkTemporario.click();
                        document.body.removeChild(linkTemporario);
                    });
                }
            });
        }
    </script>
</body>
</html>
