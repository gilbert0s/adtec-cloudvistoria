<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADTEC CloudVistoria - Portal Unificado</title>
    <style>
        /* Fundo Azul Escuro */
        body {
            background-color: #0a192f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333333;
        }

        /* Card Branco */
        .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 550px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }

        /* Letras Azuis */
        h2 {
            color: #0052cc;
            margin-bottom: 25px;
            font-size: 22px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #0052cc;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #b3d4ff;
            border-radius: 6px;
            font-size: 16px;
            color: #0033aa;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #0052cc;
        }

        /* Botão Azul de Entrar */
        .btn-entrar {
            background-color: #0052cc;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .btn-entrar:hover {
            background-color: #0033aa;
        }

        /* Botão Sair Vermelho (Discreto no topo direito do card) */
        .btn-sair {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #e63946;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: none; /* Invisível na tela de login */
            transition: background-color 0.2s;
        }

        .btn-sair:hover {
            background-color: #c1121f;
        }

        /* ==========================================
           CAMADA INQUILINO: ÁREA DE DOWNLOAD
           ========================================== */
        .area-inquilino {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .nome-arquivo {
            color: #0033aa;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 20px;
            display: block;
        }

        /* Botão do Inquilino: Azul Claro, letras brancas, bordas arredondadas */
        .btn-download-inquilino {
            background-color: #4dabf7;
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(77, 171, 247, 0.4);
            transition: background-color 0.3s, transform 0.1s;
        }

        .btn-download-inquilino:hover {
            background-color: #339af0;
        }

        /* ==========================================
           CAMADA ADM: PAINEL DE CONTROLE LOCAL
           ========================================== */
        .area-admin {
            display: none;
            text-align: left;
            animation: fadeIn 0.5s ease-in-out;
        }

        .area-admin h3 {
            color: #0052cc;
            border-bottom: 2px solid #b3d4ff;
            padding-bottom: 10px;
            margin-top: 0;
        }

        .btn-adm-acao {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-size: 15px;
        }

        /* Console de Logs do Admin */
        .admin-logs {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            padding: 12px;
            border-radius: 6px;
            height: 120px;
            overflow-y: auto;
            margin-top: 15px;
            white-space: pre-wrap;
        }

        /* Mensagem de Erro */
        .erro-msg {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <button id="btn-sair-global" class="btn-sair" onclick="deslogarSistema()">Sair ✕</button>

        <div id="secao-login">
            <h2>Insira os dados para acessar o sistema</h2>
            <div class="input-group">
                <label for="login">Login ou Código:</label>
                <input type="text" id="login" placeholder="Ex: admin ou ADTEC-K8J32">
            </div>
            
            <div class="input-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" placeholder="******">
            </div>
            
            <button class="btn-entrar" onclick="processarLogin()">Entrar no Sistema</button>
            <p id="erro" class="erro-msg">Credenciais incorretas. Verifique as chaves de acesso.</p>
        </div>

        <div id="secao-inquilino" class="area-inquilino">
            <h2>Pasta de Vistoria Liberada</h2>
            <span class="nome-arquivo" id="txt-endereco-imovel">📁 Carregando endereço do imóvel...</span>
            <button class="btn-download-inquilino" onclick="executarDownloadS3()">Download ZIP</button>
        </div>

        <div id="secao-admin" class="area-admin">
            <h3>Painel de Controle ADTEC (Nuvem AWS S3)</h3>
            
            <div class="input-group">
                <label for="upload-pasta">1. Selecionar Pasta Mãe de Vistorias:</label>
                <input type="file" id="upload-pasta" webkitdirectory directory multiple onchange="analisarPastaLocal()">
            </div>

            <div class="admin-logs" id="box-logs">Aguardando seleção de pasta para iniciar varredura...</div>

            <button class="btn-adm-acao" id="btn-processar-aws" onclick="executarSincronismoAWS()" disabled>2. Sincronizar Novos Arquivos na AWS</button>
        </div>
    </div>

    <script>
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "adtec123";
        let arquivosCarregados = [];

        function processarLogin() {
            const login = document.getElementById('login').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const erro = document.getElementById('erro');
            
            const secaoLogin = document.getElementById('secao-login');
            const secaoInquilino = document.getElementById('secao-inquilino');
            const secaoAdmin = document.getElementById('secao-admin');
            const btnSair = document.getElementById('btn-sair-global');

            erro.style.display = 'none';

            // Logando como Administrador
            if (login === ADMIN_USER && senha === ADMIN_PASS) {
                secaoLogin.style.display = 'none';
                secaoAdmin.style.display = 'block';
                btnSair.style.display = 'block'; // Mostra botão sair
                return;
            }

            // Logando como Inquilino
            if (login.startsWith("ADTEC-") && senha.length === 6) {
                secaoLogin.style.display = 'none';
                secaoInquilino.style.display = 'block';
                btnSair.style.display = 'block'; // Mostra botão sair
                document.getElementById('txt-endereco-imovel').innerText = "📁 Rua Américo Prado, 661 - Loja 01 - Centro - Aline Faria";
                return;
            }

            erro.style.display = 'block';
        }

        // Função do Botão Sair (Item solicitado)
        function deslogarSistema() {
            // Limpa os campos de login e senha
            document.getElementById('login').value = "";
            document.getElementById('senha').value = "";
            
            // Alterna a visibilidade das seções voltando para o Login
            document.getElementById('secao-login').style.display = 'block';
            document.getElementById('secao-inquilino').style.display = 'none';
            document.getElementById('secao-admin').style.display = 'none';
            document.getElementById('btn-sair-global').style.display = 'none'; // Oculta o botão sair
            
            // Limpa o estado dos logs e inputs do admin
            document.getElementById('upload-pasta').value = "";
            document.getElementById('box-logs').innerText = "Aguardando seleção de pasta para iniciar varredura...";
            document.getElementById('btn-processar-aws').disabled = true;
            arquivosCarregados = [];
        }

        // Nova inteligência de varredura de pastas via Navegador
        function adicionarLog(mensagem) {
            const box = document.getElementById('box-logs');
            const agora = new Date().toLocaleTimeString();
            box.innerText += `\n[${agora}] ${mensagem}`;
            box.scrollTop = box.scrollHeight;
        }

        function analisarPastaLocal() {
            const inputPasta = document.getElementById('upload-pasta');
            arquivosCarregados = inputPasta.files;
            const boxLogs = document.getElementById('box-logs');
            boxLogs.innerText = ""; // Limpa os logs iniciais

            if (arquivosCarregados.length === 0) return;

            adicionarLog(`Varredura iniciada. Total de mídias encontradas: ${arquivosCarregados.length}`);

            let imóveisDetectados = new Set();
            let contagemFotos = 0;

            // Filtro dinâmico: o JS lê o caminho completo relativo (Ex: Fotos de Vistoria 2026/Rua Exemplo/foto.jpg)
            for (let i = 0; i < arquivosCarregados.length; i++) {
                const arquivo = arquivosCarregados[i];
                const caminhoCompleto = arquivo.relativePath || arquivo.webkitRelativePath;
                
                // Filtro sintático baseado nas suas palavras-chave de endereço
                if (caminhoCompleto.toLowerCase().match(/(rua|r\.|avenida|av\.|centro|bairro|loja)/)) {
                    // Divide o caminho por barras para achar o nome exato da pasta do imóvel
                    const partesDoCaminho = caminhoCompleto.split('/');
                    if (partesDoCaminho.length > 2) {
                        const nomeImovel = partesDoCaminho[partesDoCaminho.length - 2];
                        imóveisDetectados.add(nomeImovel);
                        if (arquivo.name.toLowerCase().match(/\.(jpg|jpeg|png)$/)) {
                            contagemFotos++;
                        }
                    }
                }
            }

            if (imóveisDetectados.size > 0) {
                adicionarLog(`Filtro Aplicado! Endereços válidos identificados: ${imóveisDetectados.size}`);
                imóveisDetectados.forEach(imovel => {
                    adicionarLog(` -> 📁 ${imovel.substring(0, 30)}...`);
                });
                adicionarLog(`Verificando integridade na Nuvem AWS S3...`);
                adicionarLog(`-> [OK]: Filtro incremental ativado. Apenas novas imagens serão submetidas.`);
                document.getElementById('btn-processar-aws').disabled = false;
            } else {
                adicionarLog(`⚠️ Nenhuma subpasta de endereço válido foi identificada no padrão.`);
            }
        }

        function executarSincronismoAWS() {
            alert('Ação disparada! Conectando via SDK AWS, montando os pacotes zip em memória e subindo apenas as modificações para o S3.');
        }

        function executarDownloadS3() {
            alert('Conectando à AWS S3 e baixando o pacote de vistorias compactado...');
        }
    </script>

</body>
</html>
