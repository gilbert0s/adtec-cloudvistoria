<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADTEC CloudVistoria - Portal Unificado AWS</title>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1200.0.min.js"></script>
    <script src="config.js"></script><style>
        body {
            background-color: #0a192f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333333;
        }

        .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 550px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }

        h2 {
            color: #0052cc;
            margin-bottom: 25px;
            font-size: 22px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #0052cc;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #b3d4ff;
            border-radius: 6px;
            font-size: 16px;
            color: #0033aa;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #0052cc;
        }

        .btn-entrar {
            background-color: #0052cc;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .btn-entrar:hover {
            background-color: #0033aa;
        }

        .btn-sair {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #e63946;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            transition: background-color 0.2s;
        }

        .btn-sair:hover {
            background-color: #c1121f;
        }

        .area-inquilino {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .nome-arquivo {
            color: #0033aa;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 20px;
            display: block;
        }

        .btn-download-inquilino {
            background-color: #4dabf7;
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(77, 171, 247, 0.4);
            transition: background-color 0.3s;
        }

        .btn-download-inquilino:hover {
            background-color: #339af0;
        }

        .area-admin {
            display: none;
            text-align: left;
            animation: fadeIn 0.5s ease-in-out;
        }

        .area-admin h3 {
            color: #0052cc;
            border-bottom: 2px solid #b3d4ff;
            padding-bottom: 10px;
            margin-top: 0;
        }

        .btn-adm-acao {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-size: 15px;
        }

        .btn-adm-acao:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .admin-logs {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            padding: 12px;
            border-radius: 6px;
            height: 180px;
            overflow-y: auto;
            margin-top: 15px;
            white-space: pre-wrap;
        }

        .erro-msg {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <button id="btn-sair-global" class="btn-sair" onclick="deslogarSistema()">Sair ✕</button>

        <div id="secao-login">
            <h2>Insira os dados para acessar o sistema</h2>
            <div class="input-group">
                <label for="login">Login ou Código:</label>
                <input type="text" id="login" placeholder="Ex: admin ou ADTEC-K8J32">
            </div>
            
            <div class="input-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" placeholder="******">
            </div>
            
            <button class="btn-entrar" onclick="processarLogin()">Entrar no Sistema</button>
            <p id="erro" class="erro-msg">Credenciais incorretas. Verifique as chaves de acesso.</p>
        </div>

        <div id="secao-inquilino" class="area-inquilino">
            <h2>Pasta de Vistoria Liberada</h2>
            <span class="nome-arquivo" id="txt-endereco-imovel">📁 Carregando dados da AWS...</span>
            <button class="btn-download-inquilino" onclick="executarDownloadS3()">Download ZIP das Fotos</button>
        </div>

        <div id="secao-admin" class="area-admin">
            <h3>Painel de Controle ADTEC (Nuvem AWS S3)</h3>
            
            <div class="input-group">
                <label for="upload-pasta">1. Selecionar Pasta Mãe de Vistorias:</label>
                <input type="file" id="upload-pasta" webkitdirectory directory multiple onchange="analisarPastaLocal()">
            </div>

            <div class="admin-logs" id="box-logs">Aguardando seleção de pasta para iniciar varredura...</div>

            <button class="btn-adm-acao" id="btn-processar-aws" onclick="executarSincronismoAWS()" disabled>2. Sincronizar e Gerar Chaves na AWS</button>
        </div>
    </div>

    <script>
        // =========================================================================
        // CONFIGURAÇÕES CRÍTICAS DA AWS S3 (puxando servidor local)
        // =========================================================================
        const AWS_ACCESS_KEY_ID = AWS_CONFIG.accessKeyId;
        const AWS_SECRET_ACCESS_KEY = AWS_CONFIG.secretAccessKey;
        const AWS_BUCKET_NAME = AWS_CONFIG.bucketName;
        const AWS_REGION = AWS_CONFIG.region;

        // Senha padrão de Administrador local
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "adtec123";

        // Configura o SDK da Amazon com as suas credenciais
        AWS.config.update({
            accessKeyId: AWS_ACCESS_KEY_ID,
            secretAccessKey: AWS_SECRET_ACCESS_KEY,
            region: AWS_REGION
        });

        const s3 = new AWS.S3();
        let mapaPastasImoveis = {}; 

        function adicionarLog(mensagem) {
            const box = document.getElementById('box-logs');
            const agora = new Date().toLocaleTimeString();
            box.innerText += `\n[${agora}] ${mensagem}`;
            box.scrollTop = box.scrollHeight;
        }

        function processarLogin() {
            const login = document.getElementById('login').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const erro = document.getElementById('erro');
            
            const secaoLogin = document.getElementById('secao-login');
            const secaoInquilino = document.getElementById('secao-inquilino');
            const secaoAdmin = document.getElementById('secao-admin');
            const btnSair = document.getElementById('btn-sair-global');

            erro.style.display = 'none';

            if (login === ADMIN_USER && senha === ADMIN_PASS) {
                secaoLogin.style.display = 'none';
                secaoAdmin.style.display = 'block';
                btnSair.style.display = 'block';
                return;
            }

            // Fluxo Inquilino buscando credencial direto do S3
            if (login.startsWith("ADTEC-") && senha.length === 6) {
                adicionarLog("Verificando token no servidor AWS...");
                
                // Procurando o arquivo TXT correspondente a esse login na AWS
                const txtKey = `vistorias/${login}/Acesso Online.txt`;
                s3.getObject({ Bucket: AWS_BUCKET_NAME, Key: txtKey }, function(err, data) {
                    if (err) {
                        erro.innerText = "Código de acesso não encontrado na nuvem ou expirado.";
                        erro.style.display = 'block';
                    } else {
                        const textoConfig = data.Body.toString('utf-8');
                        
                        // Verifica se a senha dentro do arquivo bate com a digitada
                        if (textoConfig.includes(`Senha: ${senha}`)) {
                            secaoLogin.style.display = 'none';
                            secaoInquilino.style.display = 'block';
                            btnSair.style.display = 'block';
                            
                            // Extrai o endereço do corpo do texto salvo para exibir na tela
                            const matchEndereco = textoConfig.match(/Endereço: (.+)/);
                            const enderecoTela = matchEndereco ? matchEndereco[1] : "Imóvel ADTEC";
                            document.getElementById('txt-endereco-imovel').innerText = `📁 ${enderecoTela}`;
                            
                            // Guarda o login na sessão para o botão de download saber qual pasta baixar
                            window.sessaoLoginInquilino = login;
                        } else {
                            erro.innerText = "Senha incorreta para este código de vistoria.";
                            erro.style.display = 'block';
                        }
                    }
                });
                return;
            }

            erro.innerText = "Credenciais incorretas. Verifique as chaves de acesso.";
            erro.style.display = 'block';
        }

        function deslogarSistema() {
            document.getElementById('login').value = "";
            document.getElementById('senha').value = "";
            document.getElementById('secao-login').style.display = 'block';
            document.getElementById('secao-inquilino').style.display = 'none';
            document.getElementById('secao-admin').style.display = 'none';
            document.getElementById('btn-sair-global').style.display = 'none';
            document.getElementById('upload-pasta').value = "";
            document.getElementById('box-logs').innerText = "Aguardando seleção de pasta para iniciar varredura...";
            document.getElementById('btn-processar-aws').disabled = true;
            mapaPastasImoveis = {};
        }

        // Analisador inteligente de árvores de arquivos locais
        function analisarPastaLocal() {
            const inputPasta = document.getElementById('upload-pasta');
            const arquivos = inputPasta.files;
            const boxLogs = document.getElementById('box-logs');
            boxLogs.innerText = ""; 

            if (arquivos.length === 0) return;

            adicionarLog(`Varredura iniciada. Processando arquivos locais...`);
            mapaPastasImoveis = {};

            const PREFIXOS_VALIDOS = ["rua", "r.", "avenida", "av.", "praça", "pç", "alameda", "al."];
            const ELEMENTOS_VALIDOS = ["centro", "bairro", "loja", "fundos", "parque", "vilela", "jardim"];

            for (let i = 0; i < arquivos.length; i++) {
                const arquivo = arquivos[i];
                const caminhoRelativo = arquivo.webkitRelativePath || arquivo.relativePath;
                const caminhoMinusculo = caminhoRelativo.toLowerCase();

                // Captura o Ano da pasta mãe se baseando na estrutura do caminho
                let anoDetectado = "2026"; // Padrão de segurança
                const matchAno = caminhoRelativo.match(/202[0-9]/);
                if (matchAno) {
                    anoDetectado = matchAno.group ? matchAno.group() : matchAno[0];
                }

                // Divide o caminho para achar o nome exato da pasta do imóvel
                const partes = caminhoRelativo.split('/');
                if (partes.length > 2) {
                    const nomePastaImovel = partes[partes.length - 2];
                    const nomePastaMinusculo = nomePastaImovel.toLowerCase();

                    const temPrefixo = PREFIXOS_VALIDOS.any ? PREFIXOS_VALIDOS.any(p => nomePastaMinusculo.includes(p)) : PREFIXOS_VALIDOS.some(p => nomePastaMinusculo.includes(p));
                    const temElemento = ELEMENTOS_VALIDOS.any ? ELEMENTOS_VALIDOS.any(e => nomePastaMinusculo.includes(e)) : ELEMENTOS_VALIDOS.some(e => nomePastaMinusculo.includes(e));

                    if (temPrefixo || temElemento) {
                        if (!mapaPastasImoveis[nomePastaImovel]) {
                            mapaPastasImoveis[nomePastaImovel] = {
                                ano: anoDetectado,
                                fotos: []
                            };
                        }
                        if (arquivo.name.toLowerCase().match(/\.(jpg|jpeg|png)$/)) {
                            mapaPastasImoveis[nomePastaImovel].fotos.push(arquivo);
                        }
                    }
                }
            }

            const totalImoveis = Object.keys(mapaPastasImoveis).length;
            if (totalImoveis > 0) {
                adicionarLog(`Filtro de Árvore OK! Identificados ${totalImoveis} imóveis legítimos:`);
                for (let imovel in mapaPastasImoveis) {
                    adicionarLog(` -> 📁 [Ano: ${mapaPastasImoveis[imovel].ano}] ${imovel} (${mapaPastasImoveis[imovel].fotos.length} fotos)`);
                }
                document.getElementById('btn-processar-aws').disabled = false;
            } else {
                adicionarLog(`⚠️ Nenhum endereço correspondente aos filtros foi encontrado nas subpastas.`);
            }
        }

        // Executa o sincronismo, gera tokens limpos e escreve os TXTs na Nuvem
        async function executarSincronismoAWS() {
            document.getElementById('btn-processar-aws').disabled = true;
            adicionarLog("🚀 Iniciando upload e sincronismo na AWS S3...");

            for (let nomeImovel in mapaPastasImoveis) {
                const dadosImovel = mapaPastasImoveis[nomeImovel];
                
                // Geração do Login Limpo (Letras e números sem ano) e Senha 6 dígitos
                const sufixo = Math.random().toString(36).substring(2, 7).toUpperCase();
                const loginToken = `ADTEC-${sufixo}`;
                const senhaToken = Math.floor(100000 + Math.random() * 900000).toString();

                adicionarLog(`\nProcessando: ${nomeImovel}`);
                adicionarLog(` -> Criando credenciais: Login: ${loginToken} | Senha: ${senhaToken}`);

                // 1. Criar e fazer upload do arquivo Acesso Online.txt para o S3
                const conteudoTXT = 
                    `ADTEC IMÓVEIS - DADOS DE ACESSO À VISTORIA\n` +
                    `=========================================\n` +
                    `Endereço: ${nomeImovel}\n` +
                    `Ano de Referência da Vistoria: ${dadosImovel.ano}\n` +
                    `Login: ${loginToken}\n` +
                    `Senha: ${senhaToken}\n` +
                    `=========================================\n` +
                    `Copie os dados acima para enviar ao inquilino por WhatsApp.`;

                const txtKey = `vistorias/${loginToken}/Acesso Online.txt`;
                
                try {
                    await s3.putObject({
                        Bucket: AWS_BUCKET_NAME,
                        Key: txtKey,
                        Body: conteudoTXT,
                        ContentType: "text/plain; charset=utf-8"
                    }).promise();
                    adicionarLog(` -> [TXT SALVO NA NUVEM] com o ano ${dadosImovel.ano}`);
                } catch (err) {
                    adicionarLog(` ❌ Erro ao salvar TXT na AWS: ${err.message}`);
                    continue;
                }

                // 2. Upload incremental das fotos para a pasta desse Login no S3
                for (let foto of dadosImovel.fotos) {
                    const fotoKey = `vistorias/${loginToken}/fotos/${foto.name}`;
                    try {
                        await s3.putObject({
                            Bucket: AWS_BUCKET_NAME,
                            Key: fotoKey,
                            Body: foto,
                            ContentType: foto.type
                        }).promise();
                    } catch (err) {
                        adicionarLog(`   ❌ Falha no upload da imagem ${foto.name}: ${err.message}`);
                    }
                }
                adicionarLog(` -> [MÍDIAS SINCRONIZADAS] Total de ${dadosImovel.fotos.length} fotos enviadas.`);
                
                // Exibe no console o bloco mastigado para enviar por WhatsApp na hora!
                adicionarLog(`\n📋 COPIE PARA O WHATSAPP:\n${conteudoTXT}\n------------------------`);
            }

            alert("Sincronismo completo com a AWS S3! Os códigos gerados para envio via WhatsApp estão exibidos no console preto de logs.");
            document.getElementById('btn-processar-aws').disabled = false;
        }

        // Função executada quando o Inquilino clica para baixar as fotos dele
        function executarDownloadS3() {
            const login = window.sessaoLoginInquilino;
            if (!login) return;

            adicionarLog("Buscando lista de arquivos no servidor...");
            const prefixoPasta = `vistorias/${login}/fotos/`;

            // Lista todas as fotos daquela vistoria específica no S3
            s3.listObjectsV2({ Bucket: AWS_BUCKET_NAME, Prefix: prefixoPasta }, function(err, data) {
                if (err) {
                    alert("Erro ao buscar arquivos para download: " + err.message);
                } else {
                    if (data.Contents.length === 0) {
                        alert("Nenhuma imagem encontrada para esta vistoria na nuvem.");
                        return;
                    }
                    
                    alert(`Encontradas ${data.Contents.length} fotos. Preparando pacotes para o seu navegador baixar...`);
                    
                    // Abre os arquivos encontrados em abas para download
                    data.Contents.forEach(objeto => {
                        const urlConstruida = s3.getSignedUrl('getObject', {
                            Bucket: AWS_BUCKET_NAME,
                            Key: objeto.Key,
                            Expires: 60 // URL válida por 60 segundos
                        });
                        
                        // Executa o download nativo no navegador
                        const linkTemporario = document.createElement('a');
                        linkTemporario.href = urlConstruida;
                        linkTemporario.download = objeto.Key.split('/').pop();
                        document.body.appendChild(linkTemporario);
                        linkTemporario.click();
                        document.body.removeChild(linkTemporario);
                    });
                }
            });
        }
    </script>
</body>
</html>
